# =============================================================================
# openocd.cfg -- ST-Link/SWD bring-up and flash programming for htOS
#
#   Part     : STM32F103C8T6  (Cortex-M3, 64 KB FLASH / 20 KB SRAM, "Blue Pill")
#   Probe    : ST-Link v2 (SWD)
#   OpenOCD  : 0.12.0  @ E:\OpenOCD-20240916-0.12.0\bin
#
# Usage (never run by the build system -- flashing is a manual, deliberate step):
#   openocd -f openocd.cfg                      # GDB server on :3333 / telnet :4444
#   openocd -f openocd.cfg \
#           -c "program build/debug/htOS.elf verify reset exit"
#   openocd -f openocd.cfg -c "init; reset halt; exit"   # connectivity smoke test
#
# IMPORTANT -- FLASH SIZE:
#   ST-Link/OpenOCD frequently auto-detect and report 128 KiB of FLASH on this
#   part (the F103 family ID register is shared with 128 K parts, and many
#   clones really do have 128 K). The device fitted on this board is a
#   STM32F103C8T6 = 64 KiB. The AUTORITATIVE memory map is therefore the
#   linker script vendor/linker/STM32F103C8TX_FLASH.ld (64 KB FLASH / 20 KB RAM),
#   NOT the size the probe reports. Do not "fix" the linker script to match the
#   probe: code linked above 64 KiB would silently fail to boot.
# =============================================================================

# --- Transport ---------------------------------------------------------------
# interface/stlink.cfg already selects "hla_swd"; keep it as-is so the same
# file works with ST-Link v2 and v2-1 clones. For newer probes/DAP-Link,
# comment the two lines below and use:
#     source [find interface/stlink-dap.cfg]
#     transport select dapdirect_swd
source [find interface/stlink.cfg]
transport select hla_swd

# --- Adapter speed -----------------------------------------------------------
# 1 MHz is a safe, reliable SWD clock on this class of board and clone probe.
# Raise to 4000/8000 only if the wiring is short and stable.
adapter speed 1000

# --- Target ------------------------------------------------------------------
source [find target/stm32f1x.cfg]

# --- Programming-friendly setup ----------------------------------------------
# Allow the debugger to write FLASH (required by `program` and by gdb load).
gdb_flash_program enable

# Use hardware breakpoints by default: the F103 has only 6 hw breakpoints and no
# usable FPB-based software breakpoint range for FLASH writes.
gdb_breakpoint_override hard

# Keep the CPU halted after `reset` when programming, so the sequence
#   program <elf> verify reset exit
# erases, writes and verifies deterministically, then runs the image.
$_TARGETNAME configure -event reset-start { adapter speed 1000 }
$_TARGETNAME configure -event reset-init  { adapter speed 1000 }

# Do not let OpenOCD guess a work area: 20 KB SRAM, 4 KB reserved for the
# kernel stack at the top (see _estack / _Min_Stack_Size in the linker script).
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x4000

# Flash programming, ready to use after `init`:
#   program build/debug/htOS.bin 0x08000000 verify reset exit
