name: HTOS quality gates

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            compiler: gcc
            cflags: -Wall -Wextra -Wpedantic -Werror -std=c11
            ldflags: ""
          - name: Linux Clang sanitizers
            os: ubuntu-latest
            compiler: clang
            cflags: -Wall -Wextra -Wpedantic -Werror -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
            ldflags: -fsanitize=address,undefined
          - name: Windows Clang
            os: windows-latest
            compiler: clang
            cflags: -Wall -Wextra -Wpedantic -Werror -std=c11
            ldflags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and run host tests
        shell: bash
        env:
          CFLAGS: ${{ matrix.cflags }}
          LDFLAGS: ${{ matrix.ldflags }}
        run: python tests/run_tests.py --build --cc "${{ matrix.compiler }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-results-${{ matrix.name }}
          path: tests/test_results.txt
          if-no-files-found: warn

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install analyzers
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format clang-tidy cppcheck

      - name: Check formatting
        run: |
          clang-format --dry-run --Werror \
            include/htconfig.h include/htlist.h include/htmem.h include/htqueue.h include/htscheduler.h \
            include/htsemaphore.h include/httask.h \
            include/httypes.h include/htutils.h \
            kernel/htlist.c kernel/htmem.c kernel/htos.c kernel/htqueue.c kernel/htscheduler.c kernel/httask.c kernel/htutils.c \
            tests/stubs/core_cm3.h tests/stubs/stm32f1xx.h tests/stubs/stm32f1xx_hal.h \
            tests/test_example.c tests/test_list.c tests/test_mem.c tests/test_queue.c tests/test_task.c tests/test_utils.c

      - name: Run clang-tidy safety checks
        run: |
          clang-tidy \
            kernel/htlist.c kernel/htmem.c kernel/htqueue.c \
            --checks='-*,clang-analyzer-*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling,bugprone-sizeof-expression,bugprone-suspicious-memory-comparison' \
            --warnings-as-errors='*' \
            -- -std=c11 -Iinclude

      - name: Compile scheduler and task lifecycle boundary
        run: |
          clang -fsyntax-only \
            -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Wno-pointer-to-int-cast -Wno-int-to-pointer-cast \
            -Itests/stubs -Iinclude \
            kernel/htos.c kernel/httask.c kernel/htscheduler.c kernel/htutils.c

      - name: Run cppcheck
        run: |
          cppcheck \
            --language=c --std=c11 \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            -Iinclude \
            kernel/htlist.c kernel/htmem.c kernel/htqueue.c
