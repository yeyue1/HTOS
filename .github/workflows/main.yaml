name: HTOS quality gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            compiler: gcc
            cflags: -Wall -Wextra -Wpedantic -Werror -std=c11
            ldflags: ""
          - name: Linux Clang sanitizers
            os: ubuntu-latest
            compiler: clang
            cflags: -Wall -Wextra -Wpedantic -Werror -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
            ldflags: -fsanitize=address,undefined
          - name: Windows Clang
            os: windows-latest
            compiler: clang
            cflags: -Wall -Wextra -Wpedantic -Werror -std=c11
            ldflags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and run host tests
        shell: bash
        env:
          CFLAGS: ${{ matrix.cflags }}
          LDFLAGS: ${{ matrix.ldflags }}
        run: python tests/run_tests.py --build --cc "${{ matrix.compiler }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-results-${{ matrix.name }}
          path: tests/test_results.txt
          if-no-files-found: warn

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install analyzers
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format clang-tidy cppcheck

      - name: Check formatting
        run: |
          clang-format --dry-run --Werror \
            include/*.h \
            kernel/*.c \
            portable/Cortex-M/htPort.h portable/Cortex-M/htPortContext.c \
            portable/Host/htPort.h \
            app/main.c \
            board/board.c board/board.h board/retarget.c board/stm32f1xx_hal_conf.h board/stm32f1xx_it.c \
            tests/stubs/core_cm3.h tests/stubs/stm32f1xx.h tests/stubs/stm32f1xx_hal.h \
            tests/test_*.c

      - name: Run clang-tidy safety checks across all kernel sources
        run: |
          clang-tidy \
            kernel/*.c \
            --checks='-*,clang-analyzer-*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling,bugprone-sizeof-expression,bugprone-suspicious-memory-comparison,bugprone-branch-clone' \
            --warnings-as-errors='*' \
            -- -std=c11 -DHTOS_HOST_TEST \
            -DconfigUSE_LATENCY_STATS=1 -DconfigUSE_STATS_FORMATTING_FUNCTIONS=1 \
            -DconfigUSE_SCHED_POLICY_FAIR_SHARE=1 -DconfigUSE_SCHED_POLICY_EDF=1 \
            -DconfigUSE_TIMERS=1 -DconfigUSE_EVENT_GROUPS=1 -DconfigUSE_BLOCK_POOL=1 \
            -Iinclude -Iportable/Host -Itests/stubs

      - name: Verify HAL-free kernel boundary
        run: |
          ! grep -rnE 'stm32f1xx|core_cm3|0xE000' kernel/

      - name: Compile full kernel under host Clang
        run: |
          clang -fsyntax-only \
            -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Wno-pointer-to-int-cast -Wno-int-to-pointer-cast \
            -DHTOS_HOST_TEST \
            -DconfigUSE_LATENCY_STATS=1 -DconfigUSE_STATS_FORMATTING_FUNCTIONS=1 \
            -DconfigUSE_SCHED_POLICY_FAIR_SHARE=1 -DconfigUSE_SCHED_POLICY_EDF=1 \
            -DconfigUSE_TIMERS=1 -DconfigUSE_EVENT_GROUPS=1 -DconfigUSE_BLOCK_POOL=1 \
            -Iinclude -Iportable/Host -Itests/stubs \
            kernel/*.c

      - name: Compile GCC-compatible Cortex-M3 port
        run: |
          clang --target=arm-none-eabi -mcpu=cortex-m3 -mthumb -fsyntax-only \
            -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Itests/stubs -Iinclude -Iportable/Cortex-M \
            portable/Cortex-M/htPortContext.c

      - name: Run cppcheck across all kernel sources
        run: |
          cppcheck \
            --language=c --std=c11 \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            -DHTOS_HOST_TEST \
            -DconfigUSE_LATENCY_STATS=1 -DconfigUSE_STATS_FORMATTING_FUNCTIONS=1 \
            -DconfigUSE_SCHED_POLICY_FAIR_SHARE=1 -DconfigUSE_SCHED_POLICY_EDF=1 \
            -DconfigUSE_TIMERS=1 -DconfigUSE_EVENT_GROUPS=1 -DconfigUSE_BLOCK_POOL=1 \
            -Iinclude -Iportable/Host -Itests/stubs \
            kernel/*.c

  arm-cross-build:
    name: ARM Cortex-M3 cross-build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-none-eabi ninja-build cmake

      - name: Build Debug preset
        run: |
          cmake -S . -B build/ci-debug -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHTOS_TOOLCHAIN_ROOT=/usr
          cmake --build build/ci-debug

      - name: Build Release preset
        run: |
          cmake -S . -B build/ci-release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DHTOS_TOOLCHAIN_ROOT=/usr
          cmake --build build/ci-release

      - name: Build all-features matrix
        run: |
          cmake -S . -B build/ci-all -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DHTOS_TOOLCHAIN_ROOT=/usr \
            -DHTOS_HEAP_BYTES=4096 \
            -DHTOS_LATENCY_STATS=ON \
            -DHTOS_STATS_FORMATTING=ON \
            -DHTOS_USE_TIMERS=ON \
            -DHTOS_USE_EVENT_GROUPS=ON \
            -DHTOS_USE_BLOCK_POOL=ON \
            -DHTOS_ASYNC_CONSOLE=ON
          cmake --build build/ci-all
